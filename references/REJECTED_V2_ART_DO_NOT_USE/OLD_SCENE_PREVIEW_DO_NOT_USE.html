<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumio | 60-layer scene preview</title><style>
:root{font-family:system-ui,sans-serif;background:#f8f0e3;color:#34483d}body{margin:0;padding:16px}main{max-width:440px;margin:auto}h1{font-size:22px}.scene{width:100%;aspect-ratio:390/520;position:relative;overflow:hidden;border-radius:24px;background:#9bdce7;box-shadow:0 10px 30px #6b7c6b44}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;will-change:transform}.layer.interactive{pointer-events:auto}.drift{animation:drift var(--t) ease-in-out infinite alternate}.sway{animation:sway var(--t) ease-in-out infinite alternate;transform-origin:center 80%}.parallax{animation:parallax var(--t) ease-in-out infinite alternate}.twinkle{animation:twinkle var(--t) ease-in-out infinite alternate}.float{animation:parallax var(--t) ease-in-out infinite alternate}.flutter{animation:float var(--t) ease-in-out infinite alternate}.glow{animation:twinkle var(--t) ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(var(--a))}}@keyframes sway{to{transform:rotate(var(--a))}}@keyframes parallax{to{transform:translateY(var(--a))}}@keyframes twinkle{to{opacity:.65}}@keyframes float{to{transform:translate(5px,-6px) rotate(4deg)}}select,button{font:inherit;border:1px solid #d7c6aa;border-radius:12px;padding:10px;background:#fff9ee}button{cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.guest{position:absolute;width:22%;left:34%;top:43%;filter:drop-shadow(0 5px 3px #4b6b4b44);animation:float 4s ease-in-out infinite alternate}.note{font-size:12px;line-height:1.7;color:#647368}@media(prefers-reduced-motion:reduce){.layer,.guest{animation:none!important}}</style><main><h1>لومیو — پیش‌نمایش ۶۰ لایه</h1><div class="controls"><select id="mode"><option value="day">روز</option><option value="dawn">صبح</option><option value="dusk">غروب</option><option value="night">شب</option></select><select id="mood"><option value="idle">آرام</option><option value="smile">لبخند</option><option value="happy">شاد</option><option value="sad">ناراحت</option><option value="angry">عصبانی</option><option value="dance">رقص</option><option value="sleepy">خواب‌آلود</option><option value="curious">کنجکاو</option></select><button id="toggle">نمایش/پنهان مهمان</button></div><div class="scene" id="scene"></div><p class="note">پیش‌نمایش ترکیب واقعی ۶۰ فایل SVG مستقل است، نه اسکرین‌شات. برخی لایه‌ها برای حالت‌های روز/شب یا رویدادهای ویژه به‌صورت شرطی نمایش داده می‌شوند. کاراکتر SVG قابل‌ویرایش است؛ GIFهای تمام حالت‌ها هنوز آماده نیستند.</p></main><script>
fetch('./assets/living-world/scene-manifest.json').then(r=>r.json()).then(({layers})=>{const scene=document.getElementById('scene');const mode=document.getElementById('mode');const mood=document.getElementById('mood');const guest=document.createElement('img');guest.className='guest';guest.alt='مهمان کاغذی';function render(){scene.replaceChildren();for(const l of layers){if(l.mode!=='all'&&!l.mode.split(',').includes(mode.value))continue;if(l.mode.startsWith('event:'))continue;const im=document.createElement('img');im.src='./'+l.file;im.alt='';im.className='layer';im.style.zIndex=l.z;im.style.animationDelay=`-${(l.z*1.37)%11}s`;const a=l.amplitude||'';im.style.setProperty('--a',a.match(/[-\d.]+(?:px|deg)/)?.[0]||'2px');im.style.setProperty('--t',l.duration.match(/[\d.]+s/)?.[0]||'9s');const m=l.motion;if(m.includes('drift'))im.classList.add('drift');else if(m.includes('sway'))im.classList.add('sway');else if(m.includes('parallax'))im.classList.add('parallax');else if(m.includes('twinkle')||m.includes('glow'))im.classList.add('twinkle');else if(m.includes('flutter')||m.includes('fly'))im.classList.add('flutter');scene.append(im)}guest.src='./assets/paper-guest/'+mood.value+'.svg';guest.style.zIndex=56;scene.append(guest)}mode.onchange=render;mood.onchange=render;document.getElementById('toggle').onclick=()=>guest.hidden=!guest.hidden;render()}).catch(e=>document.body.insertAdjacentText('beforeend',String(e)))</script></html>
